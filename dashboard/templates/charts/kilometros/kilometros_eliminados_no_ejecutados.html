<style>
   .kmnr-prep-spin {
      will-change: transform;
      animation: kmnr-spin .8s linear infinite !important
   }

   .kmnr-modal .kmnr-card {
      height: 100%
   }

   .kmnr-modal .kmnr-card-b {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column
   }

   .kmnr-modal .kmnr-chart {
      flex: 1;
      height: auto !important;
      min-height: 420px
   }

   @media(prefers-reduced-motion:reduce) {
      .kmnr-prep-spin {
         animation: kmnr-spin 1.6s linear infinite !important
      }
   }

   .kmnr-chart-data-view .kmnr-table-wrap {
      max-height: 260px;
      overflow: auto
   }

   .kmnr-chart-data-view .kmnr-table th {
      background: #f4f7fc;
      color: #25397A;
      font-size: .65rem;
      font-weight: 800;
      text-align: left
   }

   .kmnr-chart-data-view .kmnr-table td {
      font-size: .68rem
   }

   .kmnr-chart-data-view .kmnr-table tbody tr:nth-child(even) {
      background: #fbfdff
   }

   .kmnr-chart-data-view .kmnr-table tbody tr:hover {
      background: #eef4ff
   }

   .kmnr-chart-data-view .kmnr-table td.kmnr-cell-number {
      text-align: right;
      font-variant-numeric: tabular-nums
   }

   .kmnr-chart-data-view .kmnr-table td.kmnr-cell-date {
      text-align: center
   }

   .kmnr-chart-data-view .kmnr-table td.kmnr-cell-text {
      text-align: left
   }

   .kmnr[data-theme=dark] .kmnr-chart-data-view .kmnr-table th {
      background: #17233a;
      color: #d7e3ff
   }

   .kmnr[data-theme=dark] .kmnr-chart-data-view .kmnr-table tbody tr:nth-child(even) {
      background: #111d31
   }

   .kmnr[data-theme=dark] .kmnr-chart-data-view .kmnr-table tbody tr:hover {
      background: #203457
   }

   .kmnr-chart-option select {
      margin-left: auto;
      max-width: 148px;
      height: 26px;
      border: 1px solid #dbe5f1;
      border-radius: 6px;
      background: #fff;
      color: #172033;
      font-size: .68rem
   }

   .kmnr[data-theme=dark] .kmnr-chart-option select {
      background: var(--surface-2);
      border-color: var(--bo);
      color: var(--tx)
   }

   .kmnr-active-filters {
      padding: 6px 7px;
      max-height: 136px;
      overflow-y: auto
   }

   .kmnr-active-filters-head {
      font-size: .56rem;
      margin-bottom: 4px
   }

   .kmnr-active-filter-list {
      gap: 4px
   }

   .kmnr-filter-chip {
      font-size: .58rem;
      padding: 2px 3px 2px 6px;
      line-height: 1.15
   }

   .kmnr-filter-chip button {
      width: 17px;
      height: 17px
   }

   .kmnr-filter-updating #kmnr-refresh i {
      animation: kmnr-spin .8s linear infinite
   }

   .kmnr-filter-updating .kmnr-topbar {
      box-shadow: 0 12px 28px rgba(37, 57, 122, .18), inset 0 -2px 0 rgba(255, 255, 255, .32)
   }

   .kmnr {
      position: relative;
      --left: clamp(250px, 21vw, 290px);
      --c1: #25397A;
      --c2: #3F5DB2;
      --c3: #5076E2;
      --bg: #f4f7fb;
      --bo: #dbe4f1;
      --tx: #172033;
      --mut: #64748b;
      --sh: 0 10px 24px rgba(15, 23, 42, .06);
      font-family: 'Century Gothic', 'Segoe UI', Arial, sans-serif;
      color: var(--tx);
      width: 100%;
      padding: 2px;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: var(--bg)
   }

   .kmnr * {
      box-sizing: border-box
   }

   .kmnr-initializing {
      visibility: hidden
   }

   .kmnr-ready {
      visibility: visible
   }

   .kmnr button,
   .kmnr input,
   .kmnr select {
      font-family: inherit
   }

   .kmnr button {
      cursor: pointer
   }

   .kmnr button:disabled {
      cursor: not-allowed;
      opacity: .55
   }

   .kmnr button:focus-visible,
   .kmnr input:focus-visible,
   .kmnr select:focus-visible {
      box-shadow: 0 0 0 3px rgba(80, 118, 226, .25);
      outline: 0
   }

   .kmnr-layout {
      display: grid;
      grid-template-columns: var(--left) minmax(0, 1fr);
      gap: 6px;
      height: 100%;
      min-height: 0
   }

   .kmnr-left {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
      min-height: 0
   }

   .kmnr-left.fixed {
      position: relative
   }

   .kmnr-main {
      min-width: 0;
      container-type: inline-size;
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      margin-left: 0
   }

   .kmnr-panel,
   .kmnr-card,
   .kmnr-kpi {
      background: #fff;
      border: 1px solid rgba(219, 228, 241, .95);
      border-radius: 8px;
      box-shadow: var(--sh);
      overflow: hidden
   }

   .kmnr-filter-panel {
      height: 100%;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden
   }

   .kmnr-filter-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 11px;
      border-bottom: 1px solid #edf2f8
   }

   .kmnr-filter-title strong {
      font-size: .82rem;
      color: var(--c1);
      display: flex;
      gap: 7px
   }

   .kmnr-active-total,
   .kmnr-group-count {
      font-size: .62rem;
      font-weight: 800;
      color: var(--c1);
      background: #eef4ff;
      border-radius: 999px;
      padding: 3px 8px;
      white-space: nowrap
   }

   .kmnr-group {
      border-bottom: 1px solid #edf2f8
   }

   .kmnr-group summary {
      list-style: none;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      color: var(--c1);
      font-size: .72rem;
      font-weight: 900;
      cursor: pointer
   }

   .kmnr-group summary::-webkit-details-marker {
      display: none
   }

   .kmnr-group-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
   }

   .kmnr-trash,
   .kmnr-caret,
   .kmnr-icon {
      width: 25px;
      height: 25px;
      border: 1px solid #dbe5f1;
      border-radius: 6px;
      background: #fff;
      color: var(--c1);
      display: inline-flex;
      align-items: center;
      justify-content: center
   }

   .kmnr-fields {
      display: grid;
      gap: 8px;
      padding: 0 10px 10px
   }

   .kmnr-field label {
      display: flex;
      margin-bottom: 3px;
      color: #667085;
      font-size: .61rem;
      font-weight: 900;
      text-transform: uppercase
   }

   .kmnr-field input,
   .kmnr-field select,
   .kmnr-combo-btn {
      width: 100%;
      height: 31px;
      border: 1px solid #dbe5f1;
      border-radius: 7px;
      background: #f8fbff;
      color: #172033;
      font-size: .72rem;
      padding: 4px 8px
   }

   .kmnr-combo-btn {
      display: flex;
      justify-content: space-between;
      align-items: center
   }

   .kmnr-menu,
   .kmnr-column-menu {
      position: fixed;
      z-index: 9998;
      width: 260px;
      max-width: calc(100vw - 18px);
      background: #fff;
      border: 1px solid #dbe5f1;
      border-radius: 8px;
      box-shadow: 0 18px 44px rgba(15, 23, 42, .17);
      padding: 7px;
      display: none
   }

   .kmnr-menu.open,
   .kmnr-column-menu.open {
      display: block
   }

   .kmnr-menu input,
   .kmnr-column-menu input[type=search] {
      width: 100%;
      height: 30px;
      border: 1px solid #dbe5f1;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: .72rem;
      margin-bottom: 6px
   }

   .kmnr-option,
   .kmnr-column-action {
      border: 0;
      background: #fff;
      color: #172033;
      text-align: left;
      border-radius: 6px;
      min-height: 28px;
      padding: 5px 7px;
      font-size: .72rem;
      width: 100%
   }

   .kmnr-column-option {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 7px;
      border-radius: 6px;
      font-size: .72rem;
      color: #172033
   }

   .kmnr-column-option:hover,
   .kmnr-column-action:hover,
   .kmnr-option:hover {
      background: #eef4ff
   }

   .kmnr-column-actions {
      display: flex;
      gap: 6px;
      margin: 6px 0
   }

   .kmnr-column-actions .kmnr-column-action {
      text-align: center;
      font-weight: 900;
      color: var(--c1)
   }

   .kmnr-filter-actions {
      padding: 10px;
      border-top: 1px solid #edf2f8
   }

   .kmnr-btn {
      height: 32px;
      border: 1px solid #dbe5f1;
      border-radius: 7px;
      background: #fff;
      color: var(--c1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: .72rem;
      font-weight: 900;
      padding: 0 10px
   }

   .kmnr-clear-all {
      width: 100%
   }

   .kmnr-topbar {
      position: relative;
      flex: 0 0 auto;
      overflow: hidden;
      background: linear-gradient(100deg, #25397A 0%, #3F5DB2 58%, #5076E2 100%);
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(37, 57, 122, .18);
      min-height: 76px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: 'title actions';
      align-items: center;
      gap: 8px
   }

   .kmnr-topbar-title {
      grid-area: title;
      text-align: center
   }

   .kmnr-topbar-title h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(1.05rem, 1.45vw, 1.30rem);
      line-height: 1.15;
      font-weight: 900
   }

   .kmnr-topbar-title p {
      margin: 3px auto 0;
      color: rgba(255, 255, 255, .88);
      font-size: clamp(.66rem, .8vw, .74rem);
      line-height: 1.28;
      max-width: 780px
   }

   .kmnr-topbar-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px 10px;
      min-width: 0;
      margin-top: 5px;
      flex-wrap: wrap;
      color: rgba(255, 255, 255, .70)
   }

   .kmnr-topbar-meta div {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0
   }

   .kmnr-topbar-meta span {
      display: inline;
      color: rgba(255, 255, 255, .66);
      font-size: .58rem;
      font-weight: 900;
      text-transform: uppercase
   }

   .kmnr-topbar-meta strong {
      display: inline;
      color: #fff;
      font-size: .6rem;
      margin-top: 0
   }

   .kmnr-topbar-actions {
      grid-area: actions;
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      flex-wrap: nowrap;
      padding-right: 8px
   }

   .kmnr-topbar .kmnr-btn {
      border-color: rgba(255, 255, 255, .36);
      background: rgba(255, 255, 255, .12);
      color: #fff
   }

   .kmnr-analytics {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 2px
   }

   .kmnr-section {
      display: flex;
      flex-direction: column;
      gap: 10px
   }

   .kmnr-section-title {
      border-bottom: 1px solid #dbe4f1;
      padding: 4px 2px 7px
   }

   .kmnr-section-title span {
      color: #64748b;
      font-size: .6rem;
      font-weight: 900;
      letter-spacing: .08em
   }

   .kmnr-section-title h2 {
      margin: 0;
      color: #25397A;
      font-size: .86rem;
      font-weight: 900
   }

   .kmnr-section-title p {
      margin: 3px 0 0;
      color: #64748b;
      font-size: .7rem;
      line-height: 1.35
   }

   .kmnr-kpis {
      display: grid;
      grid-template-columns: repeat(8, minmax(105px, 1fr));
      gap: 8px
   }

   .kmnr-kpi {
      border-left: 4px solid var(--c1);
      padding: 8px;
      min-height: 96px
   }

   .kmnr-kpi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px
   }

   .kmnr-kpi-label {
      font-size: .58rem;
      text-transform: uppercase;
      color: #667085;
      font-weight: 900
   }

   .kmnr-kpi-icon {
      width: 25px;
      height: 25px;
      border-radius: 6px;
      background: #eef4ff;
      color: var(--c1);
      display: inline-flex;
      align-items: center;
      justify-content: center
   }

   .kmnr-kpi-value {
      font-size: 1rem;
      font-weight: 900;
      margin-top: 6px
   }

   .kmnr-kpi-note {
      font-size: .63rem;
      color: #667085;
      margin-top: 4px;
      line-height: 1.22
   }

   .kmnr-grid2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px
   }

   .kmnr-card.wide {
      grid-column: 1/-1
   }

   .kmnr-card-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid #edf2f8
   }

   .kmnr-card-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: .78rem;
      color: var(--c1);
      font-weight: 900
   }

   .kmnr-card-title i {
      color: var(--c2)
   }

   .kmnr-tools {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap
   }

   .kmnr-card-b {
      position: relative;
      padding: 12px
   }

   .kmnr-chart {
      width: 100%;
      height: clamp(245px, 30vh, 310px);
      display: none
   }

   .kmnr-placeholder {
      min-height: clamp(225px, 28vh, 280px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px dashed #dbe5f1;
      border-radius: 8px;
      background: #f8fbff;
      padding: 18px;
      color: #64748b
   }

   .kmnr-placeholder-inner {
      max-width: 520px
   }

   .kmnr-placeholder-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #eef4ff;
      color: #8aa2ee;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      margin-bottom: 10px
   }

   .kmnr-placeholder strong {
      display: block;
      color: #25397A;
      font-size: .82rem;
      margin-bottom: 6px;
      text-transform: uppercase
   }

   .kmnr-placeholder p {
      margin: 0 0 8px;
      font-size: .74rem;
      line-height: 1.4
   }

   .kmnr-chip-row {
      display: flex;
      gap: 5px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 8px 0
   }

   .kmnr-chip {
      display: inline-flex;
      padding: 3px 7px;
      border-radius: 999px;
      background: #eef4ff;
      color: #25397A;
      font-size: .64rem;
      font-weight: 900
   }

   .kmnr-card-state {
      min-height: clamp(225px, 28vh, 280px);
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #64748b;
      border: 1px dashed #dbe5f1;
      border-radius: 8px;
      background: #f8fbff;
      padding: 18px;
      font-size: .78rem;
      line-height: 1.4
   }

   .kmnr-card[data-state=loading] .kmnr-card-state,
   .kmnr-card[data-state=empty] .kmnr-card-state,
   .kmnr-card[data-state=error] .kmnr-card-state {
      display: flex
   }

   .kmnr-card[data-state=ready] .kmnr-chart {
      display: block
   }

   .kmnr-card[data-state=ready] .kmnr-placeholder,
   .kmnr-card[data-state=loading] .kmnr-placeholder,
   .kmnr-card[data-state=empty] .kmnr-placeholder,
   .kmnr-card[data-state=error] .kmnr-placeholder {
      display: none
   }

   .kmnr-card[data-state=error] .kmnr-card-state {
      color: #7a1e1e;
      background: #fff5f5;
      border-color: #ffd8d8
   }

   .kmnr-note {
      margin-top: 8px;
      color: #64748b;
      font-size: .72rem;
      line-height: 1.4
   }

   .kmnr-table-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px
   }

   .kmnr-table-search {
      height: 31px;
      border: 1px solid #dbe5f1;
      border-radius: 7px;
      padding: 4px 8px;
      min-width: 230px;
      font-size: .72rem
   }

   .kmnr-table-wrap {
      overflow: auto;
      max-height: 420px;
      border: 1px solid #edf2f8;
      border-radius: 8px
   }

   .kmnr-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: .7rem
   }

   .kmnr-table th {
      position: sticky;
      top: 0;
      background: #f8fbff;
      color: var(--c1);
      font-size: .62rem;
      text-transform: uppercase;
      text-align: left
   }

   .kmnr-table th,
   .kmnr-table td {
      border-bottom: 1px solid #edf2f8;
      padding: 7px 8px;
      white-space: nowrap
   }

   .kmnr-table td {
      text-align: center;
      color: #64748b
   }

   .kmnr-pager {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      margin-top: 8px;
      color: #64748b;
      font-size: .72rem
   }

   .kmnr-modal-back {
      position: fixed;
      left: var(--modal-left, 284px);
      top: var(--modal-top, 88px);
      right: 10px;
      bottom: 10px;
      background: rgba(15, 23, 42, .32);
      z-index: 9990;
      display: none
   }

   .kmnr-modal-back.open {
      display: block
   }

   .kmnr-modal {
      position: fixed;
      left: var(--modal-left, 302px);
      top: var(--modal-top, 98px);
      right: 22px;
      bottom: 22px;
      z-index: 9991;
      display: none;
      flex-direction: column
   }

   .kmnr-modal.open {
      display: flex
   }

   .kmnr-modal .kmnr-card {
      height: 100%;
      display: flex;
      flex-direction: column
   }

   .kmnr-modal .kmnr-card-b {
      flex: 1;
      min-height: 0;
      overflow: auto
   }

   .kmnr-toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: var(--c1);
      color: #fff;
      border-radius: 8px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, .22);
      padding: 10px 12px;
      font-size: .76rem;
      z-index: 10000;
      max-width: 360px
   }

   .kmnr-pop {
      position: fixed;
      z-index: 9999;
      width: min(380px, calc(100vw - 24px));
      background: #fff;
      border: 1px solid #dbe5f1;
      border-radius: 8px;
      box-shadow: 0 18px 44px rgba(15, 23, 42, .18);
      padding: 12px;
      font-size: .76rem;
      color: #172033
   }

   .kmnr-pop-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px
   }

   .kmnr-pop strong,
   .kmnr-pop h4 {
      color: var(--c1)
   }

   .kmnr-pop h4 {
      margin: 9px 0 3px;
      font-size: .72rem
   }

   .kmnr-pop p {
      margin: 0;
      color: #64748b;
      line-height: 1.4
   }

   .kmnr-pop-close {
      width: 24px;
      height: 24px;
      border: 1px solid #dbe5f1;
      border-radius: 6px;
      background: #fff;
      color: var(--c1)
   }

   .kmnr-prep-overlay {
      position: absolute;
      inset: 0;
      z-index: 9989;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, .78);
      backdrop-filter: saturate(120%) blur(2px);
      padding: 18px
   }

   .kmnr-prep-overlay.open {
      display: flex
   }

   .kmnr-prep-card {
      width: min(360px, calc(100vw - 48px));
      background: #fff;
      border: 1px solid #dbe5f1;
      border-radius: 8px;
      box-shadow: 0 20px 54px rgba(15, 23, 42, .2);
      padding: 18px;
      text-align: center
   }

   .kmnr-prep-spin {
      width: 34px;
      height: 34px;
      margin: 0 auto 12px;
      border-radius: 50%;
      border: 3px solid #dbe7ff;
      border-top-color: #25397A;
      animation: kmnr-spin .8s linear infinite
   }

   .kmnr-prep-card strong {
      display: block;
      color: #25397A;
      font-size: .9rem;
      margin-bottom: 4px
   }

   .kmnr-prep-card span {
      display: block;
      color: #64748b;

   Varias reglas apiladas habían ido reduciendo los chips hasta 8px con la caja
   recortada a 74px: estaban en pantalla pero no se leían. Se restituye un
   tamaño legible y se deja crecer la caja. */

.kmnr-filter-chip button i{font-size:11px!important}

/* ═══ Señal de consulta en curso ═══════════════════════════════════════════
   Al cambiar un filtro solo giraba el icono del botón Actualizar, arriba a la
   derecha: fuera del punto donde se está mirando. Ahora la señal aparece donde
   sí se mira: barra de avance sobre el lienzo, contador de filtros resaltado
   con su propio giro, y cursor de espera sobre el panel. */
.kmnr-main{position:relative}
.kmnr-filter-updating .kmnr-main::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;
  border-radius:3px;z-index:60;pointer-events:none;
  background:linear-gradient(90deg,rgba(80,118,226,0) 0%,#5076E2 45%,#25397A 55%,rgba(80,118,226,0) 100%);
  background-size:45% 100%;background-repeat:no-repeat;animation:kmnr-avance 1.1s ease-in-out infinite}
@keyframes kmnr-avance{0%{background-position:-45% 0}100%{background-position:145% 0}}
.kmnr-filter-updating .kmnr-active-total{background:#25397A!important;color:#fff!important}
.kmnr-filter-updating .kmnr-active-total::before{content:'F3';
  display:inline-block;margin-right:5px;animation:kmnr-spin .8s linear infinite}
.kmnr-filter-updating .kmnr-filter-panel{cursor:progress}
@media(prefers-reduced-motion:reduce){
  .kmnr-filter-updating .kmnr-main::before{animation:none;background-position:50% 0}
  .kmnr-filter-updating .kmnr-active-total::before{animation:none}
}

/* ═══ Botón Consultar ══════════════════════════════════════════════════════
   Es la acción principal del panel: los filtros se acumulan y se envían todos
   juntos. Se distingue del resto por ser sólido, y avisa cuando hay cambios
   seleccionados que aún no se han consultado. */
.kmnr-filter-actions{display:grid;gap:7px}
.kmnr-apply-all{width:100%;background:var(--c1)!important;border-color:var(--c1)!important;color:#fff!important;
  font-weight:900;height:36px;box-shadow:0 4px 12px rgba(37,57,122,.22)}
.kmnr-apply-all:hover:not(:disabled){background:var(--c2)!important;border-color:var(--c2)!important;
  transform:translateY(-1px);box-shadow:0 6px 16px rgba(37,57,122,.3)}
.kmnr-apply-all i{font-size:.9rem}
/* Con cambios sin consultar: latido suave y punto de aviso. */
.kmnr-apply-all.tiene-cambios{animation:kmnr-latido 1.6s ease-in-out infinite;position:relative}
.kmnr-apply-all.tiene-cambios::after{content:'';position:absolute;top:-3px;right:-3px;width:11px;height:11px;
  border-radius:50%;background:#D98324;border:2px solid #fff}
@keyframes kmnr-latido{0%,100%{box-shadow:0 4px 12px rgba(37,57,122,.22)}
  50%{box-shadow:0 4px 18px rgba(217,131,36,.55)}}
/* Mientras consulta, el botón lo refleja. */
.kmnr-filter-updating .kmnr-apply-all{opacity:.75;cursor:progress;animation:none}
.kmnr-filter-updating .kmnr-apply-all::after{display:none}
.kmnr[data-theme=dark] .kmnr-apply-all{background:#3F5DB2!important;border-color:#3F5DB2!important}
@media(prefers-reduced-motion:reduce){
  .kmnr-apply-all.tiene-cambios{animation:none}
  .kmnr-apply-all:hover:not(:disabled){transform:none}
}

<!-- ══════════════════════════════════════════════════════════════════════
    DASHBOARD · Conductas Operacionales — Operadores
    Área BI : Operadores
    CSS     : bi_dashboard.css  (.bi-*)
    Tema    : _echarts_theme.html  (GE_BI.base · GE_BI.paleta · GE_BI.colores)
    Backend : dashboard/model/operadores/bi_conductas_operacionales.py · GET /api/bi/operadores/conductas_operacionales
    Estado  : Plantilla — pendiente de desarrollo (lienzo limpio, sin datos de muestra)
══════════════════════════════════════════════════════════════════════ -->

<div class="bi-tarjeta-grafica">

    <div class="bi-encabezado-grafica">
        <div class="bi-titulo-grafica">
            <i class="bi bi-exclamation-diamond-fill" style="margin-right:.4rem;color:var(--bi-primario,#25397A);"></i>
            Conductas Operacionales
        </div>
        <div class="bi-fila-kpi">
            <span class="bi-chip-kpi azul" id="chip-conductas_operacionales-total">Total: –</span>
            <span class="bi-chip-kpi verde" id="chip-conductas_operacionales-periodo">Período: –</span>
            <span class="bi-chip-kpi rojo" id="chip-conductas_operacionales-estado">En desarrollo</span>
        </div>
    </div>

    <!-- Lienzo principal -->
    <div id="lienzo-conductas_operacionales" class="bi-lienzo-grande"></div>

</div>

<script>
(async function () {
    'use strict';

    var elemento = document.getElementById('lienzo-conductas_operacionales');
    if (!elemento) return;

    var grafica = echarts.init(elemento);
    grafica.showLoading(GE_BI.cargando);

    var respuesta = null;
    try {
        respuesta = await fetch('/api/bi/operadores/conductas_operacionales').then(function (r) { return r.json(); });
    } catch (error) {
        respuesta = null;
    }

    grafica.hideLoading();

    var datos = (respuesta && respuesta.ok && Array.isArray(respuesta.datos)) ? respuesta.datos : [];

    grafica.setOption(GE_BI.base({
        backgroundColor: GE_BI.colores.superficie,

        title: [
            {
                text: 'Conductas Operacionales',
                subtext: 'Plantilla — pendiente de desarrollo · conectar consulta en bi_conductas_operacionales.py',
                left: 'center',
                top: 8,
                textStyle: {
                    color: GE_BI.colores.primario,
                    fontSize: 14,
                    fontWeight: 800,
                    fontFamily: GE_BI.fuente,
                },
                subtextStyle: {
                    color: GE_BI.colores.textoSuave,
                    fontSize: 11,
                    fontFamily: GE_BI.fuente,
                },
            },
            {
                text: datos.length ? '' : 'Sin datos disponibles',
                left: 'center',
                top: 'middle',
                textStyle: {
                    color: GE_BI.colores.textoSuave,
                    fontSize: 13,
                    fontWeight: 700,
                    fontFamily: GE_BI.fuente,
                },
            },
        ],

        xAxis: { show: false },
        yAxis: { show: false },
        series: [],
    }));

    var obs = new ResizeObserver(function () {
        if (!grafica.isDisposed()) grafica.resize();
    });
    obs.observe(elemento);
})();
</script>
